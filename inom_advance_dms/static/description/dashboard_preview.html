<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<title>Advanced DMS - Dashboard preview</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/4.7.0/css/font-awesome.min.css"/>
<style>body{margin:0;background:#eceef6}/* =========================================================================
   Advanced DMS - Document Dashboard (folder browser) styles
   Scoped under .edm-dashboard so nothing leaks into the rest of Odoo.
   ========================================================================= */

.edm-dashboard-root { height: 100%; display: flex; flex-direction: column; overflow: hidden; }

.edm-dashboard {
    --brand: #6366f1;
    --brand-2: #8b5cf6;
    --bg: #f6f7fb;
    --panel: #ffffff;
    --line: #ebedf4;
    --ink: #161a23;
    --ink-2: #5a6072;
    --muted: #9aa1b2;
    --radius: 16px;
    --shadow-sm: 0 1px 2px rgba(22,26,35,.05);
    --shadow: 0 4px 18px rgba(22,26,35,.06), 0 1px 3px rgba(22,26,35,.04);
    --shadow-lg: 0 18px 40px rgba(99,102,241,.14);

    position: relative;
    flex: 1 1 auto;
    min-height: 0;
    padding: 22px 24px 44px;
    font-family: "Plus Jakarta Sans", "Inter", -apple-system, "Segoe UI", system-ui, sans-serif;
    color: var(--ink);
    background:
        radial-gradient(1100px 480px at 88% -8%, rgba(139,92,246,.08), transparent 60%),
        radial-gradient(900px 420px at -6% 4%, rgba(99,102,241,.07), transparent 55%),
        var(--bg);
    overflow-y: auto; overflow-x: hidden; font-size: 14px;
    -webkit-font-smoothing: antialiased;
}
.edm-dashboard * { box-sizing: border-box; }

@keyframes edmRise { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: none; } }

/* ---------- header ---------- */
.edm-dashboard .edm-pro-head {
    display: flex; align-items: flex-end; justify-content: space-between;
    gap: 16px; margin-bottom: 20px; flex-wrap: wrap; animation: edmRise .45s ease both;
}
.edm-dashboard .edm-pro-title { font-size: 26px; font-weight: 800; letter-spacing: -.6px; margin: 0; }
.edm-dashboard .edm-pro-subtitle { margin: 4px 0 0; font-size: 13.5px; color: var(--ink-2); }
.edm-dashboard .edm-pro-head-actions { display: flex; gap: 10px; }
.edm-dashboard .edm-pro-btn {
    display: inline-flex; align-items: center; gap: 7px; border-radius: 11px;
    padding: 10px 15px; font-size: 13.5px; font-weight: 600; cursor: pointer;
    border: 1px solid var(--line);
    transition: transform .15s ease, box-shadow .2s ease, color .2s ease, border-color .2s ease;
}
.edm-dashboard .edm-pro-btn:hover { transform: translateY(-1px); }
.edm-dashboard .edm-pro-btn.ghost { background: var(--panel); color: var(--ink-2); box-shadow: var(--shadow-sm); }
.edm-dashboard .edm-pro-btn.ghost:hover { color: var(--brand); border-color: rgba(99,102,241,.4); }
.edm-dashboard .edm-pro-btn.primary {
    background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff;
    border-color: transparent; box-shadow: 0 8px 18px rgba(99,102,241,.28);
}
.edm-dashboard .edm-pro-btn.primary:hover { box-shadow: 0 12px 24px rgba(99,102,241,.36); }

/* ---------- stat cards ---------- */
.edm-dashboard .edm-pro-stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 16px; margin-bottom: 18px; }
.edm-dashboard .edm-pro-stat {
    position: relative; background: var(--panel); border: 1px solid var(--line);
    border-radius: var(--radius); padding: 18px; overflow: hidden; cursor: pointer;
    box-shadow: var(--shadow); transition: transform .18s ease, box-shadow .25s ease;
    animation: edmRise .5s ease both;
}
.edm-dashboard .edm-pro-stat::before {
    content: ""; position: absolute; inset: 0 0 auto 0; height: 3px;
    background: linear-gradient(90deg, var(--c), var(--c2));
}
.edm-dashboard .edm-pro-stat:hover { transform: translateY(-3px); box-shadow: var(--shadow-lg); }
.edm-dashboard .edm-pro-stat-top { display: flex; align-items: center; justify-content: space-between; min-height: 40px; }
.edm-dashboard .edm-pro-stat-badge {
    width: 40px; height: 40px; display: grid; place-items: center; border-radius: 12px;
    color: var(--c); font-size: 18px; background: color-mix(in srgb, var(--c) 12%, white);
}
.edm-dashboard .edm-pro-trend { font-size: 11.5px; font-weight: 700; padding: 4px 9px; border-radius: 50px; }
.edm-dashboard .edm-pro-trend.warn { color: #c2410c; background: rgba(245,158,11,.14); }
.edm-dashboard .edm-pro-stat-value { font-size: 32px; font-weight: 800; letter-spacing: -1px; margin-top: 12px; line-height: 1; }
.edm-dashboard .edm-pro-stat-label { font-size: 13px; color: var(--ink-2); font-weight: 600; margin-top: 6px; }

/* ---------- error ---------- */
.edm-dashboard .edm-pro-error {
    border-radius: 12px; background: rgba(245,158,11,.12); color: #b45309;
    font-weight: 600; padding: 12px 16px; margin-bottom: 16px;
}

/* ---------- body ---------- */
.edm-dashboard .edm-pro-body { display: grid; grid-template-columns: 268px 1fr; gap: 16px; align-items: start; }

/* ---------- sidebar ---------- */
.edm-dashboard .edm-pro-side {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 12px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    animation: edmRise .55s ease both;
}
.edm-dashboard .edm-pro-side-head {
    display: flex; align-items: center; justify-content: space-between; padding: 0 6px 12px;
    font-size: 13px; font-weight: 700; text-transform: uppercase; letter-spacing: .6px;
}
.edm-dashboard .edm-pro-side-total { font-size: 11px; font-weight: 700; background: #f1f2f7; color: var(--ink-2); border-radius: 50px; padding: 2px 8px; }
.edm-dashboard .edm-pro-side-search {
    display: flex; align-items: center; gap: 8px; background: #f7f8fc; border: 1px solid var(--line);
    border-radius: 10px; padding: 8px 10px; margin: 0 2px 12px; color: var(--muted);
}
.edm-dashboard .edm-pro-side-search input { border: none; outline: none; background: none; font-size: 13px; width: 100%; color: var(--ink); }
.edm-dashboard .edm-pro-tree { display: flex; flex-direction: column; gap: 2px; max-height: 360px; overflow-y: auto; }
.edm-dashboard .edm-pro-node {
    position: relative; display: flex; align-items: center; gap: 9px; padding: 9px 10px;
    border-radius: 10px; cursor: pointer; text-decoration: none; transition: background .14s ease;
}
.edm-dashboard .edm-pro-node:hover { background: #f6f7fc; }
.edm-dashboard .edm-pro-node-dot {
    width: 9px; height: 9px; border-radius: 3px; background: var(--fc); flex-shrink: 0;
    box-shadow: 0 0 0 3px color-mix(in srgb, var(--fc) 18%, transparent);
}
.edm-dashboard .edm-pro-node-name { flex: 1; font-size: 13.5px; font-weight: 500; color: var(--ink-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edm-dashboard .edm-pro-node-count { font-size: 11.5px; font-weight: 700; color: var(--muted); background: #f1f2f7; border-radius: 50px; padding: 2px 8px; min-width: 26px; text-align: center; }
.edm-dashboard .edm-pro-side-empty { color: var(--muted); font-size: 13px; padding: 14px 10px; text-align: center; }

.edm-dashboard .edm-pro-storage {
    margin-top: 14px; background: linear-gradient(135deg, #f7f8ff, #f3f1ff);
    border: 1px solid var(--line); border-radius: 14px; padding: 13px 14px;
}
.edm-dashboard .edm-pro-storage-top { display: flex; justify-content: space-between; font-size: 12.5px; font-weight: 700; }
.edm-dashboard .edm-pro-storage-num { color: var(--brand); }
.edm-dashboard .edm-pro-storage-bar { height: 7px; border-radius: 50px; background: #e7e8f2; margin: 9px 0 7px; overflow: hidden; }
.edm-dashboard .edm-pro-storage-bar span { display: block; height: 100%; border-radius: 50px; background: linear-gradient(90deg, var(--brand), var(--brand-2)); }
.edm-dashboard .edm-pro-storage-hint { margin: 0; font-size: 11px; color: var(--muted); }

/* ---------- main ---------- */
.edm-dashboard .edm-pro-main {
    background: var(--panel); border: 1px solid var(--line); border-radius: var(--radius);
    padding: 16px 18px; box-shadow: var(--shadow); display: flex; flex-direction: column;
    min-height: 540px; animation: edmRise .6s ease both;
}
.edm-dashboard .edm-pro-main-top { display: flex; align-items: center; justify-content: space-between; gap: 12px; flex-wrap: wrap; margin-bottom: 14px; }
.edm-dashboard .edm-pro-crumb { display: flex; align-items: center; gap: 7px; color: var(--muted); font-size: 13.5px; }
.edm-dashboard .edm-pro-crumb-active { color: var(--ink); font-weight: 700; }
.edm-dashboard .edm-pro-tabs { display: flex; gap: 4px; background: #f5f6fb; padding: 4px; border-radius: 11px; }
.edm-dashboard .edm-pro-tab {
    border: none; background: none; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--ink-2); padding: 7px 14px; border-radius: 8px; transition: all .15s ease;
}
.edm-dashboard .edm-pro-tab.active { background: var(--panel); color: var(--brand); box-shadow: var(--shadow-sm); }

.edm-dashboard .edm-pro-toolbar { display: flex; align-items: center; gap: 12px; margin-bottom: 16px; }
.edm-dashboard .edm-pro-search {
    flex: 1; display: flex; align-items: center; gap: 9px; background: #f7f8fc;
    border: 1px solid var(--line); border-radius: 11px; padding: 10px 13px; color: var(--muted);
    transition: border-color .15s ease, box-shadow .15s ease;
}
.edm-dashboard .edm-pro-search:focus-within { border-color: var(--brand); box-shadow: 0 0 0 3px rgba(99,102,241,.12); }
.edm-dashboard .edm-pro-search input { flex: 1; border: none; outline: none; background: none; font-size: 13.5px; color: var(--ink); }
.edm-dashboard .edm-pro-tools { display: flex; align-items: center; gap: 8px; }
.edm-dashboard .edm-pro-tool {
    display: flex; align-items: center; gap: 7px; background: var(--panel); border: 1px solid var(--line);
    border-radius: 11px; padding: 9px 13px; font-size: 13px; font-weight: 600; color: var(--ink-2);
    cursor: pointer; transition: all .15s ease;
}
.edm-dashboard .edm-pro-tool:hover { border-color: rgba(99,102,241,.4); color: var(--brand); }
.edm-dashboard .edm-pro-tool.icon { padding: 9px 11px; }

/* folder grid */
.edm-dashboard .edm-pro-grid-wrap { flex: 1; overflow-y: auto; padding-right: 4px; margin-bottom: 10px; }
.edm-dashboard .edm-pro-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 14px; }
.edm-dashboard .edm-pro-card {
    position: relative; border: 1px solid var(--line); border-radius: 16px; padding: 16px 15px 16px;
    cursor: pointer; background: var(--panel); overflow: hidden;
    transition: transform .18s ease, box-shadow .25s ease, border-color .2s ease;
}
.edm-dashboard .edm-pro-card::after {
    content: ""; position: absolute; inset: -40% 50% auto -40%; height: 120px;
    background: radial-gradient(circle, color-mix(in srgb, var(--fc) 16%, transparent), transparent 70%);
    opacity: 0; transition: opacity .25s ease; pointer-events: none;
}
.edm-dashboard .edm-pro-card:hover {
    transform: translateY(-3px);
    box-shadow: 0 16px 32px color-mix(in srgb, var(--fc) 22%, transparent);
    border-color: color-mix(in srgb, var(--fc) 40%, var(--line));
}
.edm-dashboard .edm-pro-card:hover::after { opacity: 1; }
.edm-dashboard .edm-pro-card-top { display: flex; align-items: flex-start; justify-content: space-between; }
.edm-dashboard .edm-pro-card-ico { width: 46px; height: 38px; position: relative; }
.edm-dashboard .edm-pro-card-ico::before {
    content: ""; position: absolute; left: 2px; top: 2px; width: 18px; height: 7px;
    background: color-mix(in srgb, var(--fc) 70%, white); border-radius: 4px 5px 0 0;
}
.edm-dashboard .edm-pro-card-ico::after {
    content: ""; position: absolute; left: 0; top: 7px; width: 100%; height: 30px;
    background: linear-gradient(155deg, color-mix(in srgb, var(--fc) 80%, white), var(--fc));
    border-radius: 3px 6px 6px 6px; box-shadow: inset 0 2px 0 rgba(255,255,255,.4);
}
.edm-dashboard .edm-pro-card-name { font-size: 14px; font-weight: 700; color: var(--ink); margin-top: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.edm-dashboard .edm-pro-card-meta { font-size: 12px; color: var(--muted); margin-top: 3px; }

.edm-dashboard .edm-pro-empty { text-align: center; color: var(--muted); padding: 50px 0; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.edm-dashboard .edm-pro-empty i { font-size: 36px; opacity: .55; }

/* footer */
.edm-dashboard .edm-pro-foot { display: flex; align-items: center; justify-content: space-between; border-top: 1px solid var(--line); padding-top: 13px; margin-top: auto; }
.edm-dashboard .edm-pro-foot-info { font-size: 13px; color: var(--ink-2); }
.edm-dashboard .edm-pro-pager { display: flex; align-items: center; gap: 6px; }
.edm-dashboard .edm-pro-pg {
    min-width: 32px; height: 32px; border-radius: 9px; border: 1px solid var(--line);
    background: var(--panel); color: var(--ink-2); cursor: pointer; display: grid; place-items: center;
    font-size: 13px; font-weight: 600;
}
.edm-dashboard .edm-pro-pg:disabled { opacity: .45; cursor: default; }
.edm-dashboard .edm-pro-pg.num.active { background: linear-gradient(135deg, var(--brand), var(--brand-2)); color: #fff; border-color: transparent; }

/* loading */
.edm-dashboard .edm-pro-loading {
    position: absolute; inset: 0; display: flex; flex-direction: column; align-items: center;
    justify-content: center; gap: 14px; background: rgba(246,247,251,.72); backdrop-filter: blur(2px);
    color: var(--ink-2); font-weight: 600; z-index: 20;
}
.edm-dashboard .edm-pro-spinner {
    width: 42px; height: 42px; border-radius: 50%; border: 4px solid #e3e5ef;
    border-top-color: var(--brand); animation: edmSpin .8s linear infinite;
}
@keyframes edmSpin { to { transform: rotate(360deg); } }

/* scrollbars */
.edm-dashboard .edm-pro-grid-wrap::-webkit-scrollbar,
.edm-dashboard .edm-pro-tree::-webkit-scrollbar { width: 8px; }
.edm-dashboard .edm-pro-grid-wrap::-webkit-scrollbar-thumb,
.edm-dashboard .edm-pro-tree::-webkit-scrollbar-thumb { background: #dfe1ea; border-radius: 50px; }

/* responsive */
@media (max-width: 1200px) { .edm-dashboard .edm-pro-stats { grid-template-columns: repeat(2, 1fr); } }
@media (max-width: 1024px) { .edm-dashboard .edm-pro-grid { grid-template-columns: repeat(3, 1fr); } }
@media (max-width: 880px) {
    .edm-dashboard .edm-pro-body { grid-template-columns: 1fr; }
    .edm-dashboard .edm-pro-grid { grid-template-columns: repeat(2, 1fr); }
}
@media (max-width: 560px) {
    .edm-dashboard .edm-pro-stats { grid-template-columns: 1fr; }
    .edm-dashboard .edm-pro-grid { grid-template-columns: 1fr 1fr; }
}

/* =========================================================================
   Folder navigation, document cards, kebab menu, drag & drop
   ========================================================================= */

/* breadcrumb path */
.edm-dashboard .edm-pro-crumb-link {
    color: var(--muted); font-size: 13.5px; font-weight: 600; cursor: pointer;
    display: inline-flex; align-items: center; gap: 5px;
}
.edm-dashboard .edm-pro-crumb-link:hover { color: var(--brand); }
.edm-dashboard .edm-pro-crumb-active { color: var(--ink); font-weight: 700; cursor: default; }
.edm-dashboard .edm-pro-crumb-sep { color: var(--muted); margin: 0 6px; font-size: 12px; }

/* sidebar active node */
.edm-dashboard .edm-pro-node.active-node { background: color-mix(in srgb, var(--fc) 12%, white); }
.edm-dashboard .edm-pro-node.active-node::before {
    content: ""; position: absolute; left: 0; top: 7px; bottom: 7px; width: 3px;
    border-radius: 0 4px 4px 0; background: var(--fc);
}
.edm-dashboard .edm-pro-node.active-node .edm-pro-node-name { color: var(--ink); font-weight: 700; }

/* drop zone */
.edm-dashboard .edm-pro-drop { position: relative; flex: 1; display: flex; flex-direction: column; min-height: 0; border-radius: 14px; }
.edm-dashboard .edm-pro-drop.drag-active { outline: 2px dashed var(--brand); outline-offset: -6px; background: rgba(99,102,241,.04); }
.edm-dashboard .edm-pro-drop-overlay {
    position: absolute; inset: 0; z-index: 8; display: flex; flex-direction: column;
    align-items: center; justify-content: center; gap: 10px; border-radius: 14px;
    background: rgba(99,102,241,.10); color: var(--brand); font-weight: 700; font-size: 15px;
    pointer-events: none;
}
.edm-dashboard .edm-pro-drop-overlay i { font-size: 38px; }
.edm-dashboard .edm-pro-uploading {
    display: flex; align-items: center; justify-content: center; gap: 6px;
    padding: 10px; color: var(--brand); font-weight: 600; font-size: 13px;
}

/* document card */
.edm-dashboard .edm-pro-doc-card { display: flex; flex-direction: column; }
.edm-dashboard .edm-pro-file-ico {
    width: 44px; height: 44px; display: grid; place-items: center; border-radius: 12px;
    font-size: 22px; color: var(--fc); background: color-mix(in srgb, var(--fc) 12%, white);
}
.edm-dashboard .edm-pro-kebab {
    width: 28px; height: 28px; border-radius: 8px; border: none; background: #f3f4f9;
    color: var(--ink-2); display: grid; place-items: center; cursor: pointer;
    opacity: 0; transition: opacity .15s ease, background .15s ease;
}
.edm-dashboard .edm-pro-card:hover .edm-pro-kebab { opacity: 1; }
.edm-dashboard .edm-pro-kebab:hover { background: #e7e8f0; color: var(--brand); }
.edm-dashboard .edm-pro-ext {
    text-transform: uppercase; font-size: 10.5px; font-weight: 800; letter-spacing: .4px;
    color: var(--fc); background: color-mix(in srgb, var(--fc) 12%, white);
    border-radius: 50px; padding: 2px 8px; margin-right: 6px;
}
.edm-dashboard .edm-pro-st {
    font-size: 10.5px; font-weight: 700; text-transform: capitalize;
    border-radius: 50px; padding: 2px 8px; background: #f0f1f6; color: var(--ink-2);
}
.edm-dashboard .edm-pro-st.state-approved { background: rgba(16,185,129,.14); color: #0f9d58; }
.edm-dashboard .edm-pro-st.state-rejected { background: rgba(244,63,94,.14); color: #be123c; }
.edm-dashboard .edm-pro-st.state-waiting  { background: rgba(245,158,11,.16); color: #b45309; }
.edm-dashboard .edm-pro-st.state-draft    { background: #eef0f6; color: #5a6072; }

/* kebab dropdown menu */
.edm-dashboard .edm-pro-menu {
    position: absolute; top: 44px; right: 12px; z-index: 12; min-width: 184px;
    background: var(--panel); border: 1px solid var(--line); border-radius: 12px;
    box-shadow: 0 16px 40px rgba(22,26,35,.18); padding: 6px; display: flex; flex-direction: column;
    animation: edmRise .14s ease both;
}
.edm-dashboard .edm-pro-mi {
    display: flex; align-items: center; gap: 9px; width: 100%; text-align: left;
    background: none; border: none; cursor: pointer; font-size: 13px; font-weight: 600;
    color: var(--ink-2); padding: 9px 10px; border-radius: 8px; transition: background .12s ease, color .12s ease;
}
.edm-dashboard .edm-pro-mi:hover { background: #f5f6fb; color: var(--brand); }
.edm-dashboard .edm-pro-mi i { width: 16px; text-align: center; }

.edm-dashboard .edm-pro-empty-hint { font-size: 12.5px; color: var(--muted); }

/* floating kebab menu (rendered at dashboard root, fixed to viewport) */
.edm-dashboard .edm-pro-menu.floating {
    position: fixed;
    top: auto;
    right: auto;
    z-index: 9999;
}
.edm-dashboard .edm-pro-mi.annotate { color: var(--brand); font-weight: 700; }
.edm-dashboard .edm-pro-mi.annotate:hover { background: rgba(99,102,241,.1); }

/* document card no longer needs to clip a menu; keep glow but allow card flex */
.edm-dashboard .edm-pro-doc-card .edm-pro-card-top { margin-bottom: 2px; }</style>
</head><body>
<div class="edm-dashboard-root"><div class="edm-dashboard">
  <header class="edm-pro-head">
    <div class="edm-pro-head-text"><h1 class="edm-pro-title">Documents</h1>
    <p class="edm-pro-subtitle">Manage, review and share your files in one place</p></div>
    <div class="edm-pro-head-actions">
      <button class="edm-pro-btn ghost"><i class="fa fa-plus"></i> New Folder</button>
      <button class="edm-pro-btn ghost"><i class="fa fa-paper-plane-o"></i> New Request</button>
      <button class="edm-pro-btn primary"><i class="fa fa-cloud-upload"></i> Add New File</button>
    </div>
  </header>
  <div class="edm-pro-stats">
    <div class="edm-pro-stat" style="--c:#3b82f6;--c2:#60a5fa"><div class="edm-pro-stat-top"><span class="edm-pro-stat-badge"><i class="fa fa-files-o"></i></span></div><div class="edm-pro-stat-value">1</div><div class="edm-pro-stat-label">My Documents</div></div>
