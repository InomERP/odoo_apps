<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512" role="img" aria-label="Advanced DMS">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#4F46E5"/>
      <stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <linearGradient id="folder" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#FFFFFF" stop-opacity="0.16"/>
    </linearGradient>
    <linearGradient id="sheetA" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#DCE3F5"/>
    </linearGradient>
  </defs>

  <!-- rounded app tile -->
  <rect x="0" y="0" width="512" height="512" rx="116" fill="url(#bg)"/>

  <!-- back sheet (depth / versioning) -->
  <rect x="208" y="60" width="180" height="150" rx="16"
        fill="#FFFFFF" opacity="0.43" transform="rotate(9 298 135)"/>

  <!-- front sheet with folded corner -->
  <g transform="translate(150 92)">
    <path d="M18 0h124l70 68v146a18 18 0 0 1-18 18H18A18 18 0 0 1 0 214V18A18 18 0 0 1 18 0Z"
          fill="url(#sheetA)"/>
    <path d="M142 0l70 68h-52a18 18 0 0 1-18-18Z" fill="#B9C4E4"/>
    <!-- text lines -->
    <rect x="38" y="104" width="136" height="15" rx="7.5" fill="#4F46E5" opacity="0.85"/>
    <rect x="38" y="140" width="136" height="15" rx="7.5" fill="#4F46E5" opacity="0.55"/>
    <rect x="38" y="176" width="88"  height="15" rx="7.5" fill="#4F46E5" opacity="0.35"/>
  </g>

  <!-- managing folder in front -->
  <path d="M84 300h108l30 34h206a30 30 0 0 1 30 30v58a30 30 0 0 1-30 30H84a30 30 0 0 1-30-30V330a30 30 0 0 1 30-30Z"
        fill="url(#folder)"/>
  <path d="M84 318h344a30 30 0 0 1 30 30v74a30 30 0 0 1-30 30H84a30 30 0 0 1-30-30v-74a30 30 0 0 1 30-30Z"
        fill="#FFFFFF" opacity="0.92"/>

  <!-- three stacked bars = organised / ordered documents -->
  <rect x="104" y="352" width="20" height="20" rx="6" fill="#4F46E5"/>
  <rect x="140" y="356" width="150" height="12" rx="6" fill="#4F46E5" opacity="0.45"/>
  <rect x="104" y="396" width="20" height="20" rx="6" fill="#0EA5E9"/>
  <rect x="140" y="400" width="200" height="12" rx="6" fill="#0EA5E9" opacity="0.45"/>

  <!-- check badge = approval / controlled state -->
  <circle cx="404" cy="398" r="40" fill="#22C55E"/>
  <path d="M386 398l13 14 24-28" fill="none" stroke="#FFFFFF"
        stroke-width="13" stroke-linecap="round" stroke-linejoin="round"/>
</svg>
